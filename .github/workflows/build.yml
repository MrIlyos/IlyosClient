name: Build Ilyos Client
on:
  workflow_dispatch:
  push:
    paths:
      - "src/IlyosClient/**"
      - ".github/workflows/build.yml"
      - "README.md"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish Windows x64 executable
        run: dotnet publish src/IlyosClient/IlyosClient.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IlyosClient-win-x64
          path: publish/
          if-no-files-found: error
